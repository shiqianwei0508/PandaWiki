services:
  panda-wiki-postgres:
    image: postgres:16-alpine
    container_name: panda-wiki-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: panda-wiki
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: panda-wiki
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      default:
        ipv4_address: 172.29.0.3
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U panda-wiki"]
      interval: 10s
      timeout: 5s
      retries: 10

  panda-wiki-redis:
    image: redis:7-alpine
    container_name: panda-wiki-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - ./data/redis:/data
    networks:
      default:
        ipv4_address: 172.29.0.4

  panda-wiki-minio:
    image: minio/minio:latest
    container_name: panda-wiki-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    # 绑定 0.0.0.0：Nginx 部署在独立服务器，需跨机访问本容器端口。
    # 请在宿主防火墙仅放行 Nginx 服务器 IP，避免端口直接暴露公网。
    ports:
      - "9000:9000"
    volumes:
      - ./data/minio:/data
    networks:
      default:
        ipv4_address: 172.29.0.12

  panda-wiki-nats:
    image: nats:2.10-alpine
    container_name: panda-wiki-nats
    restart: unless-stopped
    command: ["-js", "--user", "panda-wiki", "--pass", "${NATS_PASSWORD}"]
    volumes:
      - ./data/nats:/data
    networks:
      default:
        ipv4_address: 172.29.0.13

  panda-wiki-qdrant:
    image: chaitin-registry.cn-hangzhou.cr.aliyuncs.com/chaitin/panda-wiki-qdrant:v1.14.1
    container_name: panda-wiki-qdrant
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
    volumes:
      - ./data/qdrant:/qdrant/storage
    networks:
      default:
        ipv4_address: 172.29.0.5

  panda-wiki-raglite:
    image: chaitin-registry.cn-hangzhou.cr.aliyuncs.com/chaitin/raglite:v2.14.1
    container_name: panda-wiki-raglite
    restart: unless-stopped
    depends_on:
      panda-wiki-postgres:
        condition: service_healthy
      panda-wiki-minio:
        condition: service_started
      panda-wiki-qdrant:
        condition: service_started
      panda-wiki-nats:
        condition: service_started
    environment:
      GIN_MODE: release
      DATABASE_POSTGRESQL_HOST: panda-wiki-postgres
      DATABASE_POSTGRESQL_USER: panda-wiki
      DATABASE_POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_QDRANT_HOST: panda-wiki-qdrant
      DATABASE_QDRANT_API_KEY: ${QDRANT_API_KEY}
      STORAGE_MINIO_ENDPOINT: panda-wiki-minio:9000
      STORAGE_MINIO_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      STORAGE_MINIO_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      NATS_URL: nats://panda-wiki-nats:4222
      NATS_USER: panda-wiki
      NATS_PASSWORD: ${NATS_PASSWORD}
      EMBEDDER_RPM: "800"
      LLM_RPM: "50"
    networks:
      default:
        ipv4_address: 172.29.0.18

  panda-wiki-api:
    image: ${PANDAWIKI_IMAGE_REPO}/pandawiki-api:${PANDAWIKI_IMAGE_TAG}
    container_name: panda-wiki-api
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PG_DSN: host=panda-wiki-postgres user=panda-wiki password=${POSTGRES_PASSWORD} dbname=panda-wiki port=5432 sslmode=disable TimeZone=Asia/Shanghai
      MQ_NATS_SERVER: nats://panda-wiki-nats:4222
      NATS_PASSWORD: ${NATS_PASSWORD}
      REDIS_ADDR: panda-wiki-redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      S3_ENDPOINT: panda-wiki-minio:9000
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      SENTRY_ENABLED: "false"
      RAG_CT_RAG_BASE_URL: http://panda-wiki-raglite:5050
      # ============================================================
      # 站点对外域名（base_url）
      # 前台/后台在需要拼接"完整对外绝对 URL"（分享链接、sitemap、
      # OAuth 回调、微信/飞书/钉钉等回调地址）时会用到它。
      #
      # 填写规则（二选一，优先级：后台「知识库设置」> 此处）：
      #   1. 留空（推荐单域名 Nginx 部署）：前台会自动用浏览器当前
      #      域名（由 Nginx 的 Host/X-Forwarded-Proto 推导）兜底；
      #      后台接口走同源 /admin 前缀，无需此值。
      #   2. 显式填写：如 https://wiki.example.com
      #      作用于所有未单独配置 base_url 的知识库作为全局兜底。
      # ============================================================
      KB_BASE_URL: ""
    depends_on:
      panda-wiki-postgres:
        condition: service_healthy
      panda-wiki-redis:
        condition: service_started
      panda-wiki-minio:
        condition: service_started
      panda-wiki-nats:
        condition: service_started
      panda-wiki-raglite:
        condition: service_started
    # 绑定 0.0.0.0：Nginx 部署在独立服务器，需跨机访问本容器端口。
    # 请在宿主防火墙仅放行 Nginx 服务器 IP，避免端口直接暴露公网。
    ports:
      - "8000:8000"
    networks:
      default:
        ipv4_address: 172.29.0.2

  panda-wiki-consumer:
    image: ${PANDAWIKI_IMAGE_REPO}/pandawiki-consumer:${PANDAWIKI_IMAGE_TAG}
    container_name: panda-wiki-consumer
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PG_DSN: host=panda-wiki-postgres user=panda-wiki password=${POSTGRES_PASSWORD} dbname=panda-wiki port=5432 sslmode=disable TimeZone=Asia/Shanghai
      MQ_NATS_SERVER: nats://panda-wiki-nats:4222
      NATS_PASSWORD: ${NATS_PASSWORD}
      REDIS_ADDR: panda-wiki-redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      S3_ENDPOINT: panda-wiki-minio:9000
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      SENTRY_ENABLED: "false"
      RAG_CT_RAG_BASE_URL: http://panda-wiki-raglite:5050
    depends_on:
      panda-wiki-postgres:
        condition: service_healthy
      panda-wiki-redis:
        condition: service_started
      panda-wiki-minio:
        condition: service_started
      panda-wiki-nats:
        condition: service_started
      panda-wiki-raglite:
        condition: service_started
    networks:
      default:
        ipv4_address: 172.29.0.7

  panda-wiki-app:
    image: ${PANDAWIKI_IMAGE_REPO}/pandawiki-app:${PANDAWIKI_IMAGE_TAG}
    container_name: panda-wiki-app
    restart: unless-stopped
    environment:
      TARGET: http://panda-wiki-api:8000
      STATIC_FILE_TARGET: http://panda-wiki-minio:9000
      DEV_KB_ID: ${DEV_KB_ID}
      PORT: "3010"
    depends_on:
      panda-wiki-api:
        condition: service_started
    # 绑定 0.0.0.0：Nginx 部署在独立服务器，需跨机访问本容器端口。
    # 请在宿主防火墙仅放行 Nginx 服务器 IP，避免端口直接暴露公网。
    ports:
      - "3010:3010"
    networks:
      default:
        ipv4_address: 172.29.0.112

  panda-wiki-admin:
    image: ${PANDAWIKI_IMAGE_REPO}/pandawiki-admin:${PANDAWIKI_IMAGE_TAG}
    container_name: panda-wiki-admin
    restart: unless-stopped
    depends_on:
      panda-wiki-api:
        condition: service_started
      panda-wiki-minio:
        condition: service_started
    # 绑定 0.0.0.0：Nginx 部署在独立服务器，需跨机访问本容器端口。
    # 请在宿主防火墙仅放行 Nginx 服务器 IP，避免端口直接暴露公网。
    ports:
      - "2443:2443"
    networks:
      default:
        ipv4_address: 172.29.0.11

networks:
  default:
    ipam:
      config:
        - subnet: 172.29.0.0/24
